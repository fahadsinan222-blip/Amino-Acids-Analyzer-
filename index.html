
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amino Acids Analyzer</title>
    <link rel="stylesheet" href="./style.css">

    <style>
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"] {
            box-sizing: border-box;
            max-width: 100%;
        }

        button {
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <form id="form">

        <div>
            <br>

            <input
                type="text"
                placeholder="First Name"
                name="first_name"
                autocomplete="given-name"
                style="width:450px;height:40px;color:black;border:3px solid #0056b3;border-radius:999px;font-size:16px"
                required
            >

            <input
                type="text"
                placeholder="Last Name"
                name="last_name"
                autocomplete="family-name"
                style="width:450px;height:40px;color:black;border:3px solid #0056b3;border-radius:999px;font-size:16px"
                required
            >
        </div>

        <br>

        <input
            type="email"
            placeholder="Email"
            name="email"
            autocomplete="email"
            style="width:450px;height:40px;color:black;border:3px solid #0056b3;border-radius:999px;font-size:16px"
            required
        >

        <input
            type="tel"
            placeholder="Phone"
            name="phone"
            autocomplete="tel"
            style="width:450px;height:40px;color:black;border:3px solid #0056b3;border-radius:999px;font-size:16px"
            required
        >

        <div>
            <br>

            <label for="birth_date">Birth Date:</label>

            <input
                type="date"
                id="birth_date"
                name="birth_date"
                style="width:450px;height:40px;color:black;border:3px solid #0056b3;border-radius:999px;font-size:16px"
                required
            >

            <br><br>

            <span>Gender:</span>

            <label for="male">Male</label>
            <input
                type="radio"
                id="male"
                name="gender"
                value="Male"
                required
            >

            <label for="female">Female</label>
            <input
                type="radio"
                id="female"
                name="gender"
                value="Female"
                required
            >
        </div>

        <br>

        <fieldset>
            <legend>Education Level:</legend>

            <label for="master">Master</label>
            <input
                type="radio"
                id="master"
                name="education"
                value="Master"
                required
            >

            <label for="phd">PhD</label>
            <input
                type="radio"
                id="phd"
                name="education"
                value="PhD"
                required
            >

            <label for="student">Student</label>
            <input
                type="radio"
                id="student"
                name="education"
                value="Student"
                required
            >

            <label for="researcher">Researcher</label>
            <input
                type="radio"
                id="researcher"
                name="education"
                value="Researcher"
                required
            >

            <label for="other">Other</label>
            <input
                type="radio"
                id="other"
                name="education"
                value="Other"
                required
            >
        </fieldset>

        <br>

        <!-- Sends registration details to Formspree -->
        <button
            type="submit"
            id="registerButton"
            style="width:200px;height:40px;color:white;background-color:#28a745;border:none;border-radius:999px;font-size:16px"
        >
            Submit Registration
        </button>

        <p id="message" role="status" aria-live="polite"></p>

        <h1>Thanks for visiting the Amino Acids Analyzer</h1>

        <div>
            <br><br><br>

            <button
                type="button"
                id="sbutton"
                style="width:150px;height:40px;color:white;background-color:#007bff;border:none;border-radius:999px;font-size:16px"
                disabled
            >
                Start Analysis
            </button>

            <button
                type="button"
                id="dbutton"
                style="width:150px;height:40px;color:white;background-color:#007bff;border:none;border-radius:999px;font-size:16px"
                disabled
            >
                Learn More
            </button>

            <br><br>

            <button
                type="button"
                id="ybutton"
                style="width:300px;height:40px;color:white;background-color:#007bff;border:none;border-radius:999px;font-size:16px"
                disabled
            >
                Contact Me
            </button>
        </div>

    </form>

    <script>
        document.addEventListener("DOMContentLoaded", function () {

            const mainform = document.getElementById("form");
            const message = document.getElementById("message");
            const registerButton = document.getElementById("registerButton");

            const startanalysisbtn = document.getElementById("sbutton");
            const learnmorebtn = document.getElementById("dbutton");
            const contactbtn = document.getElementById("ybutton");

            const navigationButtons = [
                startanalysisbtn,
                learnmorebtn,
                contactbtn
            ];

            // Enable navigation when all required fields are valid.
            function checkForm() {
                const isValid = mainform.checkValidity();

                navigationButtons.forEach(function (button) {
                    button.disabled = !isValid;
                });
            }

            mainform.addEventListener("input", checkForm);
            mainform.addEventListener("change", checkForm);

            // Send registration details to Formspree.
            mainform.addEventListener("submit", async function (event) {
                event.preventDefault();

                if (!mainform.checkValidity()) {
                    mainform.reportValidity();
                    return;
                }

                registerButton.disabled = true;
                registerButton.textContent = "Sending...";
                message.textContent = "Submitting your registration...";

                try {
                    const response = await fetch(
                        "https://formspree.io/f/mgaorplk",
                        {
                            method: "POST",
                            body: new FormData(mainform),
                            headers: {
                                "Accept": "application/json"
                            }
                        }
                    );

                    if (response.ok) {
                        message.textContent =
                            "Registration submitted successfully! You can continue.";

                        registerButton.textContent = "Registration Sent";

                        // Keep the entered details so the valid
                        // navigation buttons remain enabled.
                        checkForm();
                    } else {
                        message.textContent =
                            "Submission failed. Check your Formspree form and email settings.";

                        registerButton.disabled = false;
                        registerButton.textContent = "Submit Registration";
                    }

                } catch (error) {
                    message.textContent =
                        "Connection error. Check your internet connection and try again.";

                    registerButton.disabled = false;
                    registerButton.textContent = "Submit Registration";
                }
            });

            // Navigation.
            startanalysisbtn.addEventListener("click", function () {
                window.location.href = "analyzer.html";
            });

            learnmorebtn.addEventListener("click", function () {
                window.location.href = "learn_more.html";
            });

            contactbtn.addEventListener("click", function () {
                window.location.href = "contact.html";
            });

            checkForm();

        });
    </script>

</body>
</html>
